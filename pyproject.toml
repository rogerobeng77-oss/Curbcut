[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curbcut"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # google-api-core is pinned below 2.35.0, and the ceiling is load-bearing.
    # 2.35.0 percent-encodes path segments when building a resource name, so
    # Firestore's DEFAULT_DATABASE "(default)" becomes "%28default%29" and every
    # query fails server-side with `400 Invalid database id %28default%29`.
    # Reproduced offline by bisecting the five packages a rebuild moved:
    #   api-core 2.34.0 -> projects/p/databases/(default)      works
    #   api-core 2.35.0 -> projects/p/databases/%28default%29  400s
    # firestore, google-auth and google-cloud-core were all ruled out; only
    # api-core changes the result. tests/test_dependency_pins.py fails loudly
    # if a future resolution reintroduces this.
    "google-api-core>=2.34.0,<2.35.0",
    "google-adk>=2.7.1",
    "google-genai>=2.19.0",
    "google-cloud-firestore>=2.16.0",
    "google-cloud-pubsub>=2.21.0",
    "google-cloud-run>=0.10.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-gcp-trace>=1.6.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "playwright>=1.45.0",
    "PyGithub>=2.3.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "httpx2>=2.0.0", "requests>=2.32.0"]

[tool.setuptools.packages.find]
include = ["substrate*", "app*", "job*"]

[tool.substrate]
# The Python the container is built on. Declared here so there is one place to
# change it, next to requires-python: that is the *support floor* (what the
# library must import under), this is the *deploy target* (what production
# actually runs). They are different facts and were previously conflated.
#
# Not a .python-version file: uv and pyenv act on that one, so it would rewrite
# developers' venvs as a side effect of stating a deploy intention. Not derived
# from the local interpreter either -- the 3.11 venv is whichever Python uv
# happened to find, and there is no CI pinning it.
deploy-python = "3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["slow: exercises a real headless browser scan; slower than the unit suite"]
