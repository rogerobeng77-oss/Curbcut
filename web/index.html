<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curbcut</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/console.css">
</head>
<body>
  <a class="skip" href="#run">Skip to run detail</a>

  <header class="masthead">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <span class="name">Curbcut</span>
    </div>
    <p class="strap">Accessibility patches, and the proof each one worked.</p>
  </header>

  <div class="frame">
    <nav class="runs" aria-labelledby="runs-heading">
      <div class="runs-head">
        <h2 id="runs-heading">Runs</h2>
        <span class="tally" id="tally">—</span>
      </div>
      <ol class="run-list" id="run-list"></ol>
    </nav>

    <main class="detail" id="run" tabindex="-1">
      <div id="detail-body"></div>
    </main>
  </div>

  <template id="tpl-run-row">
    <li class="run-row">
      <button type="button" class="run-btn">
        <span class="run-repo"></span>
        <span class="run-meta">
          <span class="run-pr"></span>
          <span class="run-verdict"></span>
        </span>
        <span class="run-counts"></span>
      </button>
    </li>
  </template>

  <script src="/static/console.js"></script>
</body>
</html>
